<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoClean | Login</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/login.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <div class="login-card">


<img src="js/images/goclean.jpeg" alt="GoClean Logo" class="logo">
            <h1>Welcome Back</h1>

            <p>Login to your GoClean account</p>

            <form id="loginForm">

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address"
                        required>

                </div>

                <div class="input-box password-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>

                    <i
                        class="fa-solid fa-eye"
                        id="togglePassword"></i>

                </div>

                <div class="options">

                    <label>

                        <input type="checkbox">

                        Remember Me

                    </label>

                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>

                </div>

                <button type="submit">

                    Login

                </button>

            </form>

            <div class="signup-link">

                Don't have an account?

                <a href="signup.html">

                    Sign Up

                </a>

            </div>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
